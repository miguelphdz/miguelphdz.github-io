<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pago Exitoso | Bicitas</title>

  <!-- Redirección automática: PayPal envía token en ?token=XYZ -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    if (token) {
        window.location.href = "http://localhost:8000/paypal-success?token=" + token;
    }
  </script>

  <style>
    body {
      background: #fef6f8;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      max-width: 350px;
    }
    .icon {
      font-size: 60px;
      color: #34c759;
    }
    .msg {
      font-size: 20px;
      margin-top: 10px;
      font-weight: bold;
    }
    .sub {
      margin-top: 5px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">✓</div>
    <div class="msg">Pago exitoso</div>
    <div class="sub">Redirigiendo a tu Bicita...</div>
  </div>
</body>
</html>
