<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url='http://127.0.0.1:8000/payment-success'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo…</title>

    <!-- Fuente similar a la de tu app -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f8fafc; /* similar a bg-base-200 */
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1f2937; /* text-gray-800 */
        }

        .card {
            background: white;
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 380px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .text {
            font-size: 0.95rem;
            color: #6b7280;
        }

        /* Spinner estilo Bicitas */
        .spinner {
            margin: 1.5rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid #fde5d3;  /* naranja suave */
            border-top-color: #f97316; /* naranja fuerte */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .small {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
